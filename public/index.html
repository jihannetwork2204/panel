<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NightCloud Server Panel</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="bg"></div>
<header><div><b>☁ NightCloud</b><span> Server Panel</span></div><div id="status">● Offline</div></header>
<main>
<section class="cards">
<div class="card"><small>Panel</small><strong>Node.js</strong></div>
<div class="card"><small>Workspace</small><strong id="root">Loading…</strong></div>
<div class="card"><small>Process</small><strong id="proc">Stopped</strong></div>
</section>

<section class="grid">
<div class="panel">
<div class="title">⚙ Server Control</div>
<label>Start server command</label>
<div class="row"><input id="startup" placeholder="npm start"><button onclick="save()">Save</button></div>
<div class="row"><button class="green" onclick="startServer()">▶ Start</button><button class="red" onclick="stopServer()">■ Stop</button></div>
</div>

<div class="panel">
<div class="title">📁 File Manager</div>
<div class="row"><input id="path" placeholder="relative path, e.g. src/index.js"><button onclick="loadFiles()">Open</button></div>
<div id="files"></div>
</div>
</section>

<section class="panel terminal">
<div class="title">💻 Bash Terminal</div>
<div id="term"></div>
<div class="row"><input id="cmd" autocomplete="off" placeholder="Type command…"><button onclick="run()">Run</button></div>
<small>Commands execute on the same machine as this panel, with the panel directory as the working directory.</small>
</section>
</main>
<script src="/socket.io/socket.io.js"></script><script src="/js/app.js"></script>
</body></html>
